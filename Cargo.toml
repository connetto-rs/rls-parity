[workspace]
members = ["."]
resolver = "3"

[package]
name = "rls-parity"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
diesel = { version = "2.3", features = ["postgres", "sqlite", "serde_json"] }
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
pg2sqlite = { git = "https://github.com/connetto-rs/pg2sqlite", branch = "main", features = ["diesel"] }
rls2fga = { git = "https://github.com/connetto-rs/rls2fga", branch = "main", features = ["client"] }
sql-traits = { git = "https://github.com/connetto-rs/sql-traits", branch = "main" }
sqlparser = "0.64"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
toml = "0.9"
anyhow = "1"

[patch.crates-io]
sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
diesel = { git = "https://github.com/diesel-rs/diesel", branch = "main" }
# `rls2fga` main needs `sql-values` 0.6, which is not yet on crates.io.
sql-values = { git = "https://github.com/connetto-rs/sql-values", branch = "main" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[lints]
workspace = true
